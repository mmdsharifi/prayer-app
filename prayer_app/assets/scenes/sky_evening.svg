    <circle cx="560" cy="140" r="1.3" fill="#ffffff"/>
    <circle cx="700" cy="90" r="1.6" fill="#ffffff"/>
    <circle cx="820" cy="160" r="1.4" fill="#ffffff"/>
    <circle cx="1120" cy="70" r="1.5" fill="#ffffff"/>
    <circle cx="80" cy="190" r="1.0" fill="#ffffff"/>
